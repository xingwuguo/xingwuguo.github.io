<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col">
        {% if site.lang == "cn" %}
        <p><b>关键词: </b>{{ site._description.cn | escape }}</p>
        {% else %}
        <p><b>Keywords: </b>{{ site._description.en | escape }}</p>
        {% endif %}
        ©{{ 'now' | date: '%Y' }} Xingwu Guo. All Rights Reserved.
      </div>
    </div>

  </div>

</footer>
