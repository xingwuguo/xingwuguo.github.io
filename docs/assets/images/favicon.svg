<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b01030"/>
      <stop offset="100%" stop-color="#dc143c"/>
    </linearGradient>
    <linearGradient id="film1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>
    <linearGradient id="film2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.35)"/>
    </linearGradient>
    <linearGradient id="film3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Three thin-film layers: conformal coatings on a surface -->
  <!-- Bottom layer (substrate surface profile) -->
  <path d="M80 340 Q160 280, 256 310 Q352 340, 432 280"
        stroke="url(#film3)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Middle layer (first deposited film) -->
  <path d="M80 280 Q160 220, 256 250 Q352 280, 432 220"
        stroke="url(#film2)" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Top layer (outermost film) -->
  <path d="M80 220 Q160 160, 256 190 Q352 220, 432 160"
        stroke="url(#film1)" stroke-width="28" fill="none" stroke-linecap="round"/>
</svg>
