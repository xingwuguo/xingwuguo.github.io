  quiet_deps: true

# Site Descriptions (used for SEO and page metadata)
_description: 
  cn: >-
    镁合金微弧氧化;
    铝合金快速阳极氧化;
    无电解槽阳极氧化及涂层修复技术;
    等离子体增强化学气相沉积 (PECVD);
    物理气相沉积 (PVD);
    气致变色薄膜;
    材料化学; 
    表面改性; 
    电化学;
    腐蚀与防护
  en: >-
    Magnesium Anodizing & PEO; 
    Aluminium Fast Anodizing; 
    Anodic Oxidation and Coating Repair Technology without Electrolytic Cell;
    PECVD;
    PVD;
    Gasochromic Film;
    Materials Chemistry; 
    Surface Modification; 
    Electrochemistry;
    Corrosion and Protection

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://xingwuguo.github.io" # the base hostname & protocol for your site
description: >-
  Dr. Xingwu Guo (郭兴伍) - Surface Science & Film Technology Lab at Shanghai Jiao Tong University (SJTU).
  Research in surface modification, thin films, PVD, PECVD, PEO, and corrosion protection of light metals.

keywords: "Dr. Xingwu Guo, SJTU, Surface Science, Film Technology, Magnesium Anodizing, PEO, PECVD, PVD, Material Science, Corrosion Protection, 上海交通大学, 郭兴伍, 表面科学, 薄膜技术, 镁合金, 微弧氧化"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-email-protect
  - jekyll-multiple-languages-plugin
  - jekyll-seo-tag
  - jekyll-sitemap

languages: ["cn", "en"]
language_names:
  cn: 中文
  en: English version

include: ["_pages"]
