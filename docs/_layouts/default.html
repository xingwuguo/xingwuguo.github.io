<!DOCTYPE html>
{%- assign document_language = page.lang | default: site.lang | default: "cn" -%}
{%- if document_language == "cn" -%}
  {%- assign document_language = "zh" -%}
{%- endif -%}
<html lang="{{ document_language }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
